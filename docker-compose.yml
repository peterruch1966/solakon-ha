services:
  solakon-local:
    build: .
    image: solakon-local:latest
    container_name: solakon-local
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      # Home Assistant URL as seen from inside this container.
      # If HA runs with network_mode: host on the same Pi, use the Pi's LAN IP
      # or http://172.17.0.1:8123 (docker bridge gateway).
      HA_URL: ${HA_URL:-http://172.17.0.1:8123}
      # Long-lived access token of an HA *admin* user (Profile → Security).
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN in .env}
      TZ: ${TZ:-Europe/Berlin}
      # Optional password for the web UI (HTTP basic auth, any user name).
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - ./data:/data
